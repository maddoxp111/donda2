<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donda 2 - Audio Stack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sometype+Mono&display=swap');

    body {
      background-color: #fff;
      color: #000;
      font-family: 'Sometype Mono', monospace;
      font-size: 12px;
      padding: 40px;
    }

    .track {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .track-title {
      width: 200px;
    }

    .play-pause {
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      margin: 0 5px;
    }

    input[type="range"] {
      accent-color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="playlist"></div>

  <script>
    const tracks = [
      { title: 'TRUE LOVE', file: '01 TRUE LOVE.mp3' },
      { title: 'BROKEN ROAD', file: '02 BROKEN ROAD.mp3' },
      { title: 'GET LOST', file: '03 GET LOST.mp3' },
      { title: 'KEEP THE FLOWERS', file: '04 KEEP THE FLOWERS.mp3' },
      { title: 'TOO EASY', file: '05 TOO EASY.mp3' },
      { title: 'PABLO', file: 'pablo.mp3' }
    ];

    const playlist = document.getElementById('playlist');
    const audioElements = []; // Store all audio elements

    tracks.forEach((track, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'track';

      const title = document.createElement('div');
      title.className = 'track-title';
      title.textContent = track.title;

      const button = document.createElement('div');
      button.className = 'play-pause';
      button.textContent = '⏵';

      const audio = new Audio(track.file);
      audioElements.push(audio);

      const progress = document.createElement('input');
      progress.type = 'range';
      progress.min = 0;
      progress.value = 0;
      progress.step = 1;
      progress.style.width = '200px';

      const timeLabel = document.createElement('div');
      timeLabel.style.marginLeft = '10px';
      timeLabel.textContent = '0:00 / 0:00';

      // Format seconds to MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' + s : s}`;
      };

      // Update progress & time display
      audio.addEventListener('timeupdate', () => {
        progress.value = audio.currentTime;
        timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
      });

      audio.addEventListener('loadedmetadata', () => {
        progress.max = audio.duration;
        timeLabel.textContent = `0:00 / ${formatTime(audio.duration)}`;
      });

      // Seek
      progress.addEventListener('input', () => {
        audio.currentTime = progress.value;
      });

      // Auto-play next track when this ends
      audio.addEventListener('ended', () => {
        audio.currentTime = 0;
        button.textContent = '⏵';
        const next = audioElements[index + 1];
        const nextBtn = playlist.querySelectorAll('.play-pause')[index + 1];
        if (next && nextBtn) {
          next.play();
          nextBtn.textContent = '⏸';
        }
      });

      // Play/Pause button logic
      button.addEventListener('click', () => {
        // Pause all other tracks
        audioElements.forEach((a, i) => {
          if (a !== audio) {
            a.pause();
            a.currentTime = 0;
            playlist.querySelectorAll('.play-pause')[i].textContent = '⏵';
          }
        });

        // Play or pause selected track
        if (audio.paused) {
          audio.play();
          button.textContent = '⏸';
        } else {
          audio.pause();
          button.textContent = '⏵';
        }
      });

      wrapper.appendChild(title);
      wrapper.appendChild(button);
      wrapper.appendChild(progress);
      wrapper.appendChild(timeLabel);
      playlist.appendChild(wrapper);
    });
  </script>

</body>
</html>
